<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab#9 Using Flickr API</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    #getBtn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #2563eb;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #getBtn:hover {
      background-color: #1d4ed8;
    }

    #status {
      margin-bottom: 20px;
      color: #444;
      min-height: 24px;
    }

    .gallery {
      --g: 6px;

      display: grid;
      width: 1200px;
      max-width: 100%;
      margin: 0 auto;
      aspect-ratio: 1;
      grid: auto-flow 1fr / repeat(3,1fr);
      gap: var(--g);
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale();
      cursor: pointer;
      transition: .5s;
      display: block;
    }

    .gallery img:hover {
      filter: grayscale(0);
    }

    .gallery img:nth-child(2) {
      grid-area: 1/2/span 2/span 2;
      clip-path: polygon(
        0 0,
        100% 0,
        100% 100%,
        calc(50% + var(--g)/4) 100%,
        0 calc(50% - var(--g)/4)
      );
    }

    .gallery img:nth-child(3) {
      grid-area: 2/1/span 2/span 2;
      clip-path: polygon(
        0 0,
        calc(50% - var(--g)/4) 0,
        100% calc(50% + var(--g)/4),
        100% 100%,
        0 100%
      );
    }

    @media (max-width: 768px) {
      .gallery {
        width: 100%;
        aspect-ratio: auto;
        grid-template-columns: 1fr;
        grid-auto-flow: row;
      }

      .gallery img,
      .gallery img:nth-child(2),
      .gallery img:nth-child(3) {
        grid-area: auto;
        clip-path: none;
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <h1>Lab#9 Using Flickr API</h1>
  <button id="getBtn">Get IMG</button>
  <div id="status">尚未載入圖片</div>
  <div id="gallery" class="gallery"></div>

  <script src="script.js"></script>
</body>
</html>
